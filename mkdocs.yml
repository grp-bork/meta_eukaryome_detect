site_name: meta_eukaryome_detect
site_url: https://grp-bork.embl-community.io/grp-microbiome-astrology/meta_eukaryome_detect/
repo_url: https://github.com/grp-bork/meta_eukaryome_detect
repo_name: grp-bork/meta_eukaryome_detect
strict: true
watch:
  - meta_eukaryome_detect
nav:
  - Home: index.md
  - Installation: installation.md
  - eukscan:
      - Usage: usage.md
      - Method: method.md
      - Output: output.md
  - Database: database.md
  - Citation: citation.md
  - Contributing: contributing.md
  - Changelog: changelog.md
theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    scheme: preference
    primary: indigo
    accent: indigo
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs.sticky
markdown_extensions:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - admonition
  - toc:
      baselevel: 2
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - meta
plugins:
  - include-markdown
  - search:
      lang: en
  - mkdocstrings
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grp-bork/meta_eukaryome_detect
      name: Github
    - icon: material/email
      link: "mailto:anthony.fullam@embl.de"
